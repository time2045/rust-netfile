<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NB 文件管理器</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <div class="logo">NB</div>
      <div class="brand-text">
        <h1>NB 文件管理器</h1>
        <p>局域网文件共享 · 启动台</p>
      </div>
    </div>
    <div class="header-actions">
      <span class="badge" id="statusBadge">检测中</span>
      <button class="icon-btn" id="themeToggle" title="切换亮/暗主题">◐</button>
    </div>
  </header>

  <div class="demo-banner hidden" id="demoBanner">浏览器演示模式：当前为模拟数据，桌面命令不可用。</div>

  <main>
    <section class="card status-card">
      <div class="status-left">
        <span class="dot" id="statusDot"></span>
        <div>
          <h2 id="statusTitle">正在读取状态…</h2>
          <p id="statusHint">—</p>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" id="btnStart">启动服务</button>
        <button class="btn" id="btnStop">停止服务</button>
        <button class="btn" id="btnConsole">打开 Web 控制台</button>
      </div>
    </section>

    <section class="grid cols-2">
      <div class="card">
        <div class="card-title">访问地址</div>
        <div class="url-list" id="urlList"><span class="muted">服务未运行</span></div>
        <p class="hint" id="urlHint"></p>
      </div>
      <div class="card">
        <div class="card-title">磁盘空间</div>
        <div class="meter"><span id="diskBar"></span></div>
        <p class="hint" id="diskText">—</p>
        <div class="kv">
          <span>监听端口</span><b id="kvPort">—</b>
          <span>监听范围</span><b id="kvBind">—</b>
        </div>
      </div>
    </section>

    <section class="stats">
      <div class="card stat"><span>运行时长</span><b id="statUptime">—</b></div>
      <div class="card stat"><span>上传流量</span><b id="statUpload">—</b></div>
      <div class="card stat"><span>下载流量</span><b id="statDownload">—</b></div>
      <div class="card stat"><span>在线设备</span><b id="statOnline">—</b></div>
    </section>

    <section class="grid cols-2">
      <div class="card">
        <div class="card-title">服务与安全</div>
        <div class="rows">
          <div class="row"><span>访问密码</span><b id="pwdState">—</b></div>
          <div class="row"><span>自动启动服务</span><b id="autoState">—</b></div>
          <div class="row"><span>锁定状态</span><b id="lockState">—</b></div>
        </div>
        <div class="actions">
          <button class="btn danger" id="btnLock">锁定服务</button>
          <button class="btn" id="btnUnlock">解锁服务</button>
          <button class="btn" id="btnResetPwd">重置访问密码</button>
        </div>
        <p class="hint">端口、共享目录、上传限制、日志与回收站请在 Web 控制台中管理。</p>
      </div>
      <div class="card">
        <div class="card-title">路径与快捷操作</div>
        <dl class="paths">
          <dt>共享目录</dt><dd id="pathRoot">—</dd>
          <dt>数据目录</dt><dd id="pathData">—</dd>
          <dt>日志文件</dt><dd id="pathLog">—</dd>
        </dl>
        <div class="actions">
          <button class="btn" id="btnOpenDir">打开共享目录</button>
          <button class="btn" id="btnOpenData">打开数据目录</button>
        </div>
      </div>
    </section>

    <section class="card error-card" id="errorCard">
      <div class="card-title">最近错误</div>
      <p id="lastError">无</p>
    </section>
  </main>

  <footer>
    <span id="version">NB 文件管理器</span>
    <span>关闭窗口后驻留系统托盘</span>
  </footer>
</div>

<div class="toast-box" id="toastBox"></div>

<div class="modal" id="pwdModal">
  <div class="modal-box">
    <h3>重置访问密码</h3>
    <p class="hint">重置后全部网页登录会话立即失效。留空表示清除密码，局域网内将可匿名访问（不推荐）。</p>
    <label class="field"><span>新密码</span><input type="password" id="newPwd" autocomplete="new-password"></label>
    <label class="field"><span>确认新密码</span><input type="password" id="newPwd2" autocomplete="new-password"></label>
    <div class="modal-actions">
      <button class="btn" id="pwdCancel">取消</button>
      <button class="btn primary" id="pwdOk">确认重置</button>
    </div>
  </div>
</div>
</body>
</html>
